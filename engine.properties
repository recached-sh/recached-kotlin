# The recached-mobile core this package is built against.
#
#   ref     git ref of recached-sh/recached that CI builds the engine from:
#           the host library the unit tests load and the server the live
#           tests run against, always; the Android libraries and Kotlin
#           bindings too, until a release is pinned below
#   version, url, sha256
#           the recached release whose recached-mobile-android archive is
#           packed into published AARs, via scripts/fetch-engine.sh
#
# recached-mobile is not in a release yet, so nothing is pinned. Move `ref`
# to `dev` once feat/recached-mobile merges.
ref=feat/recached-mobile
version=
url=
sha256=
