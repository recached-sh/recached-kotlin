[versions]
agp = "9.4.1"
# Kotlin 2.2 is what AGP 9.4 bundles, and it bounds who can consume this
# library: Kotlin reads metadata at most one minor version ahead, so building
# with 2.4 would lock out every app still on 2.2. Raise it deliberately.
kotlin = "2.2.10"
# Each chosen to need nothing newer than the Kotlin version above.
kotlinx-coroutines = "1.10.2"
# Not newer: OkHttp 5.4 makes every app that depends on it compile against
# API 36, and 5.5 against API 37 (their AAR metadata). Apps on a newer OkHttp
# still get theirs, since Gradle resolves the highest version requested.
okhttp = "5.3.2"
jna = "5.19.1"
# Not 2.11: lifecycle-process 2.11 constrains the whole lifecycle family to
# 2.11, and lifecycle-runtime-compose 2.11 makes every app that uses it compile
# against API 37. Through that constraint, depending on this SDK would have
# forced it on every Compose app. 2.10 asks for API 35 at most.
androidx-lifecycle = "2.10.0"
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
maven-publish = "0.37.0"
# Demo app only. The newest that still build with Kotlin 2.2 (as in Notewell).
compose-bom = "2026.02.01"
material-icons = "1.7.8"
activity-compose = "1.11.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

# Demo app
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core", version.ref = "material-icons" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
